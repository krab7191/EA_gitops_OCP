---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-automation
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # ROSA: update to your fork's repo URL
    repoURL: https://github.com/krab7191/EA_gitops_OCP
    targetRevision: main
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
