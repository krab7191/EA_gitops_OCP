apiVersion: batch/v1
kind: Job
metadata:
  name: es-ca-sync
  namespace: event-streams
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: es-ca-sync
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              CA="$(kubectl -n event-streams get secret es-prod-cluster-ca-cert \
                   -o go-template='{{index .data "ca.crt" | base64decode}}')"
              tmp=/tmp/es-ca.crt
              printf "%s" "$CA" > "$tmp"
              for NS in event-processing event-endpoint-mgmt flink; do
                kubectl -n "$NS" create secret generic es-cluster-ca \
                  --from-file=es-ca.crt="$tmp" \
                  --dry-run=client -o yaml | kubectl -n "$NS" apply -f -
              done