apiVersion: batch/v1
kind: Job
metadata:
  name: es-ca-sync
  namespace: event-streams
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: es-ca-sync
      containers:
        - name: sync
          image: registry.access.redhat.com/ubi9/openjdk-21:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              # Install kubectl
              curl -sLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x /tmp/kubectl
              export PATH="/tmp:$PATH"

              # Extract ES cluster CA cert
              CA="$(kubectl -n event-streams get secret es-prod-cluster-ca-cert \
                   -o go-template='{{index .data "ca.crt" | base64decode}}')"
              printf "%s" "$CA" > /tmp/es-ca.crt

              # Extract EP root CA cert
              EP_CA="$(kubectl -n event-processing get secret production-processing-ibm-ep-root-ca \
                   -o go-template='{{index .data "ca.crt" | base64decode}}')"
              printf "%s" "$EP_CA" > /tmp/ep-root-ca.crt

              # Build JKS truststore: default cacerts + ES CA + EP root CA
              cp "$JAVA_HOME/lib/security/cacerts" /tmp/truststore.jks
              chmod 644 /tmp/truststore.jks
              keytool -keystore /tmp/truststore.jks -alias es-cluster-ca -import \
                -file /tmp/es-ca.crt -noprompt -storepass changeit -trustcacerts
              keytool -keystore /tmp/truststore.jks -alias ep-root-ca -import \
                -file /tmp/ep-root-ca.crt -noprompt -storepass changeit -trustcacerts

              # Push PEM secret and JKS truststore secret to each namespace
              for NS in event-processing event-endpoint-mgmt flink; do
                kubectl -n "$NS" create secret generic es-cluster-ca \
                  --from-file=es-ca.crt=/tmp/es-ca.crt \
                  --dry-run=client -o yaml | kubectl -n "$NS" apply -f -
                kubectl -n "$NS" create secret generic ssl-truststore \
                  --from-file=truststore.jks=/tmp/truststore.jks \
                  --dry-run=client -o yaml | kubectl -n "$NS" apply -f -
              done