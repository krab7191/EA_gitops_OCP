---
# Patches the OpenShift GitOps ArgoCD instance with a custom Subscription
# health check. The openshift-gitops-operator reads resourceCustomizations from
# this CR and populates argocd-cm accordingly — do not edit argocd-cm directly.
#
# Why: All operator subscriptions use installPlanApproval: Manual. OLM sets
# subscription state to UpgradePending when a new version is available but not
# yet approved. Without this, ArgoCD treats UpgradePending as Progressing,
# keeping the operators app stuck on Progressing indefinitely.
#
# The UpgradePending exception is scoped specifically to ibm-eventstreams.v12.2.1
# which has a known TLS bug and is intentionally held. All other UpgradePending
# subscriptions will still show Progressing to alert that approval is needed.
apiVersion: argoproj.io/v1alpha1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  resourceCustomizations: |
    operators.coreos.com/Subscription:
      health.lua: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.state == "AtLatestKnown" then
            hs.status = "Healthy"
            hs.message = obj.status.state
            return hs
          end
          if obj.status.state == "UpgradePending" and
             obj.status.currentCSV == "ibm-eventstreams.v12.2.1" then
            hs.status = "Healthy"
            hs.message = "UpgradePending: ibm-eventstreams.v12.2.1 intentionally held (known TLS bug)"
            return hs
          end
          if obj.status.state == "Installing" then
            hs.status = "Progressing"
            hs.message = "Installing"
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for subscription"
        return hs
