---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operators
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # ROSA: update to your fork's repo URL
    repoURL: https://github.com/krab7191/EA_gitops_OCP
    targetRevision: main
    path: operators
    directory:
      recurse: true
      # ROSA: if Terraform manages operator subscriptions, uncomment exclude
      # to skip subscription/namespace/operatorgroup files:
      # exclude: '{event-streams/*,event-processing/*,event-endpoint-mgmt/*,flink/*}'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true