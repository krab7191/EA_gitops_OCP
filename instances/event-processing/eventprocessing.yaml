---
apiVersion: events.ibm.com/v1beta1
kind: EventProcessing
metadata:
  name: production-processing
  namespace: event-processing
  labels:
    app.kubernetes.io/name: event-processing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  license:
    accept: true
    use: EventAutomationProduction
    license: L-CYBH-K48BZQ

  # OIDC authentication
  # ROSA: change site to Azure AD issuer URL, e.g. https://login.microsoftonline.com/<tenant-id>/v2.0
  # ROSA: update authorizationClaimPointer to match Azure AD token claim path (e.g. /roles or /groups)
  # ROSA: regenerate oidc-client-secret sealed secret with Azure AD client credentials
  authoring:
    # TLS: use Let's Encrypt cert for the UI route (switches from passthrough to reencrypt)
    # The ep-ui-tls secret is created by the Certificate resource in ep-certificate.yaml
    tls:
      ui:
        secretName: ep-ui-tls
      trustedCertificates:
        - secretName: es-cluster-ca
          certificate: es-ca.crt
    template:
      pod:
        spec:
          containers:
            - name: backend
              env:
                - name: JAVA_TOOL_OPTIONS
                  value: >-
                    -Djavax.net.ssl.trustStore=/opt/ibm/sp-backend/certs/truststore.jks
                    -Djavax.net.ssl.trustStorePassword=changeit
              volumeMounts:
                - mountPath: /opt/ibm/sp-backend/certs
                  name: truststore
                  readOnly: true
          volumes:
            - name: truststore
              secret:
                secretName: ssl-truststore
                items:
                  - key: truststore.jks
                    path: truststore.jks
    authConfig:
      authType: OIDC
      oidcConfig:
        authorizationClaimPointer: /roles
        clientIDKey: client-id
        clientSecretKey: client-secret
        discovery: true
        secretName: oidc-client-secret
        site: https://keycloak-keycloak.apps.itz-3xs4bj.infra01-lb.wdc07.techzone.ibm.com/realms/FSU-EA
    storage:
      type: persistent-claim
      size: 10Gi
      # ROSA: change to gp3-csi
      storageClassName: ocs-external-storagecluster-ceph-rbd
      deleteClaim: false

  # Flink endpoint for stream processing
  flink:
    endpoint: production-flink-rest.flink.svc.cluster.local:8081
