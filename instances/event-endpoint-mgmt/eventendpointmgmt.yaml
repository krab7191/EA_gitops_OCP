---
apiVersion: events.ibm.com/v1beta1
kind: EventEndpointManagement
metadata:
  name: production-eem
  namespace: event-endpoint-mgmt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: event-endpoint-management
spec:
  license:
    accept: true
    use: EventAutomationProduction
    license: L-CYBH-K48BZQ
    metric: VIRTUAL_PROCESSOR_CORE

  # Manager component - API catalog and governance
  manager:
    # OIDC authentication configuration
    # ROSA: change site to Azure AD issuer URL, e.g. https://login.microsoftonline.com/<tenant-id>/v2.0
    # ROSA: update authorizationClaimPointer to match Azure AD token claim path (e.g. /roles or /groups)
    # ROSA: update userGroupClaimPointer to match Azure AD groups claim path (e.g. /groups)
    # ROSA: regenerate oidc-client-secret sealed secret with Azure AD client credentials
    authConfig:
      authType: OIDC
      oidcConfig:
        # authorizationClaimPointer: JSON path to roles in OIDC token
        # Used for role-based access control (admin, author, viewer)
        # EEM checks ID token -> Access token -> User Info in that order
        # Example: /roles maps to token.roles array
        authorizationClaimPointer: /roles
        
        # userGroupClaimPointer: JSON path to groups in OIDC token
        # REQUIRED for user groups feature (cluster maintainers, event source editors, option viewers)
        # Without this, the "User groups" menu will not appear in EEM UI
        # Must point to a string or array of strings containing group names
        # EEM checks ID token -> Access token -> User Info in that order
        # Example: /groups maps to token.groups array from Keycloak
        # Common paths: /groups, /resource_access/client-id/groups, /realm_access/groups
        userGroupClaimPointer: /groups
        
        # additionalScopes: Optional additional OAuth scopes to request
        # Uncomment and add "offline_access" if using Admin API with user groups
        # This allows EEM to refresh tokens and retrieve up-to-date group memberships
        # Note: Not all OIDC providers support offline_access
        # additionalScopes: ["offline_access"]
        
        clientIDKey: client-id
        clientSecretKey: client-secret
        discovery: true
        secretName: oidc-client-secret
        site: https://keycloak-keycloak.apps.itz-3xs4bj.infra01-lb.wdc07.techzone.ibm.com/realms/FSU-EA

    # Storage for catalog and metadata
    storage:
      type: persistent-claim
      size: 10Gi
      # ROSA: change to gp3-csi
      storageClassName: ocs-external-storagecluster-ceph-rbd
      deleteClaim: false
