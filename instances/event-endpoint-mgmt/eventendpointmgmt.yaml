---
apiVersion: events.ibm.com/v1beta1
kind: EventEndpointManagement
metadata:
  name: production-eem
  namespace: event-endpoint-mgmt
  labels:
    app.kubernetes.io/name: event-endpoint-management
spec:
  license:
    accept: true
    use: EventAutomationProduction
    license: L-AUKS-FKVXVL
    metric: VIRTUAL_PROCESSOR_CORE
  
  # Manager component - API catalog and governance
  manager:
    # OIDC authentication
    # ROSA: change site to Azure AD issuer URL, e.g. https://login.microsoftonline.com/<tenant-id>/v2.0
    # ROSA: update authorizationClaimPointer to match Azure AD token claim path (e.g. /roles or /groups)
    # ROSA: regenerate oidc-client-secret sealed secret with Azure AD client credentials
    authConfig:
      authType: OIDC
      oidcConfig:
        authorizationClaimPointer: /roles
        clientIDKey: client-id
        clientSecretKey: client-secret
        discovery: true
        secretName: oidc-client-secret
        site: https://keycloak-keycloak.apps.itz-3xs4bj.infra01-lb.wdc07.techzone.ibm.com/realms/FSU-EA

    # Storage for catalog and metadata
    storage:
      type: persistent-claim
      size: 10Gi
      # ROSA: change to gp3-csi
      storageClassName: ocs-external-storagecluster-ceph-rbd
      deleteClaim: false
