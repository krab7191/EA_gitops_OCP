---
apiVersion: events.ibm.com/v1beta1
kind: EventGateway
metadata:
  name: production-egw
  namespace: event-endpoint-mgmt
  annotations:
    # Deploy after EEM Manager (wave 1) so the manager service and CA secret exist
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: event-gateway
spec:
  license:
    accept: true
    use: EventAutomationProduction
    license: L-CYBH-K48BZQ
    metric: VIRTUAL_PROCESSOR_CORE

  # Connection to the EEM Manager via internal service DNS — no cluster domain dependency
  managerEndpoint: https://production-eem-ibm-eem-gateway.event-endpoint-mgmt.svc:443

  # TLS - uses the CA certificate auto-generated by the EEM Manager CR
  tls:
    caSecretName: production-eem-ibm-eem-manager-ca

  # Gateway group identity
  gatewayGroupName: production-gateway-group
  gatewayID: production-egw
