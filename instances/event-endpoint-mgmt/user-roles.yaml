---
# User role mappings for Event Endpoint Management
# Maps OIDC token roles (from authorizationClaimPointer: /roles) to EEM permissions
# ROSA: update "id" values to match Azure AD role/group names

# EEM Role Hierarchy:
# - viewer: View UI and shared resources (read-only)
# - author: Create and share resources (includes viewer permissions)
# - admin: Configure gateways, security, and user groups (includes author permissions)
#
# Note: Admin role hierarchically includes author and viewer, but we explicitly
# assign all three roles to ensure maximum visibility and permissions across all UI features,
# including the "User groups" menu and all administrative functions.

apiVersion: v1
kind: Secret
metadata:
  name: production-eem-ibm-eem-user-roles
  namespace: event-endpoint-mgmt
type: Opaque
stringData:
  user-mapping.json: |
    {
      "mappings": [
        {
          "id": "admin",
          "roles": ["admin", "author", "viewer", "user"]
        },
        {
          "id": "author",
          "roles": ["author", "viewer", "user"]
        },
        {
          "id": "viewer",
          "roles": ["viewer", "user"]
        },
        {
          "id": "user",
          "roles": "user"
        }
      ]
    }
